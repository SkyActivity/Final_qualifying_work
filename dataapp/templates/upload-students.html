{% block content %}
  <form id="uploadStudentsForm" class="mb-3" method="post" enctype="multipart/form-data">
     {% csrf_token %}
      <div class="form-group mt-3 mb-3">
          <label class="form-label fw-bold" for="students_file">Выберите XLSX файл</label>
          <input type="file" class="form-control" name="file" id="students_file" accept=".xlsx" required>
      </div>
      <div class="text-muted small mb-3">
          Возраст считается автоматически. Шаблон: <code>uploads/students_template.xlsx</code>
      </div>
      <button type="submit" class="btn btn-primary">Загрузить</button>
  </form>
  <div id="messageStudents" class="mt-3"></div>
{% endblock %}
