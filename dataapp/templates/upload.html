{% block content %}
  <form id="uploadDataForm" class="mb-3" method="post" enctype="multipart/form-data">
     {% csrf_token %}
      <div class="form-group mt-3 mb-3">
          <label class="form-label fw-bold" for="file">Выберите XLSX файл</label>
          <input type="file" class="form-control" name="file" id="file" accept=".xlsx" required>
      </div>
      <button type="submit" class="btn btn-primary">Загрузить</button>
  </form>
  <div id="messageData" class="mt-3"></div>
{% endblock %}
